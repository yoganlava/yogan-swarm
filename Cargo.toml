[package]
name = "yogan-swarm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.29"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
tui-textarea = "0.7"
unicode-width = "0.2"

[[bin]]
name = "yogan"
path = "src/main.rs"
